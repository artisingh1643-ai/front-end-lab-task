
<!DOCTYPE html>
<html>
<head>
    <title>Task 8 - DOM Applications</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            color: darkblue;
        }

        .container {
            background: white;
            width: 60%;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 50%;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
            background-color: royalblue;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: darkblue;
        }

        li {
            list-style: none;
            margin: 10px;
            padding: 10px;
            background: lightblue;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        /* Chessboard */

        #chessboard {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            grid-template-rows: repeat(8, 50px);
            justify-content: center;
            margin: 20px auto;
            border: 2px solid black;
            width: fit-content;
        }

        .square {
            width: 50px;
            height: 50px;
        }

        .black {
            background-color: #333;
        }

        .white {
            background-color: white;
        }
    </style>
</head>
