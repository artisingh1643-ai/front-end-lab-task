<!DOCTYPE html>
<html>
<head>
    <title>Question 7</title>
</head>
<body>

    <script>
        let num = 7;
        let fact = 1;
        let i = 1;

        while (i <= num) {
            fact = fact * i;
            i++;
        }

        console.log("Factorial: " + fact);
    </script>

</body>
</html>
