<!DOCTYPE html>
<html>
<head>
    <title>Question 9</title>
</head>
<body>

    <script>
        let num = 5837462;
        let evenSum = 0;
        let oddSum = 0;

        while (num > 0) {
            let digit = num % 10;

            if (digit % 2 == 0) {
                evenSum = evenSum + digit;
            }
            else {
                oddSum = oddSum + digit;
            }

            num = Math.floor(num / 10);
        }

        console.log("Sum of Even Digits: " + evenSum);
        console.log("Sum of Odd Digits: " + oddSum);
    </script>

</body>
</html>
