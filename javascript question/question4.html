<!DOCTYPE html>
<html>
<head>
    <title>Question 4</title>
</head>
<body>

    <script>
        let x = prompt("Enter a String");

        if (x == null || x == "") {
            console.log("Please Enter a Proper Input");
        }
        else {
            let choice = prompt("Enter 1 to Remove Spaces");

            switch (choice) {
                case "1":
                    console.log(x.trim());
                    break;

                default:
                    console.log("Invalid Choice");
            }
        }
    </script>

</body>
</html>
