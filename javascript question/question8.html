<!DOCTYPE html>
<html>
<head>
    <title>Question 8</title>
</head>
<body>

    <script>
        let num = 12321;
        let temp = num;
        let rev = 0;

        while (temp > 0) {
            let digit = temp % 10;

            rev = rev * 10 + digit;

            temp = Math.floor(temp / 10);
        }

        if (num == rev) {
            console.log("Palindrome Number");
        }
        else {
            console.log("Not a Palindrome Number");
        }
    </script>

</body>
</html>
