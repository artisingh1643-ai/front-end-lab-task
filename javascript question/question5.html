<!DOCTYPE html>
<html>
<head>
    <title>Question 5</title>
</head>
<body>

    <script>
        let x = prompt("Enter a Number");

        if (x == "" || x == null || isNaN(x)) {
            console.log("Please Enter a Valid Number");
        }
        else {
            let num = parseInt(x);
            let rev = 0;
            let sum = 0;

            while (num > 0) {
                let digit = num % 10;

                rev = rev * 10 + digit;
                sum = sum + digit;

                num = Math.floor(num / 10);
            }

            console.log("Reverse Number: " + rev);
            console.log("Sum of Digits: " + sum);
        }
    </script>

</body>
</html>
