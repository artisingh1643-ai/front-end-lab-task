<!DOCTYPE html>
<html>
<head>
    <title>Task 7 - DOM Manipulation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
        }

        .container {
            background: white;
            padding: 20px;
            margin: 30px auto;
            width: 80%;
            border-radius: 10px;
        }

        input {
            padding: 10px;
        }

        button {
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            margin: 10px;
            list-style: none;
        }

        .remove {
            background: red;
            margin-left: 10px;
        }

        .main-image {
            width: 300px;
            height: 200px;
            object-fit: cover;
        }

        .thumbnail {
            width: 100px;
            height: 70px;
            margin: 10px;
            cursor: pointer;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>To-Do List</h2>

        <input type="text" id="taskInput"
               placeholder="Enter your task">

        <button onclick="addTask()">Add Task</button>

        <ul id="taskList"></ul>
    </div>

    <div class="container">
        <h2>Image Gallery</h2>

        <img id="mainImage"
        class="main-image"
        src="https://picsum.photos/id/1015/300/200">

        <br>

        <img class="thumbnail"
        src="https://picsum.photos/id/1015/300/200">

        <img class="thumbnail"
        src="https://picsum.photos/id/1016/300/200">

        <img class="thumbnail"
        src="https://picsum.photos/id/1018/300/200">
    </div>

    <script>

        // To-Do List
        function addTask() {

            let input = document.getElementById("taskInput");
            let task = input.value;

            if (task === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");

            li.textContent = task;

            let btn = document.createElement("button");
            btn.textContent = "Remove";
            btn.className = "remove";

            btn.addEventListener("click", function() {
                li.remove();
            });

            li.appendChild(btn);

            document.getElementById("taskList")
            .appendChild(li);

            input.value = "";
        }


        // Image Gallery
        let thumbnails = document.querySelectorAll(".thumbnail");

        let mainImage = document.getElementById("mainImage");

        thumbnails.forEach(function(img) {

            img.addEventListener("click", function() {

                mainImage.src = img.src;

            });

        });

    </script>

</body>
</html>
