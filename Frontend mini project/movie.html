<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Search App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎬 Movie Search</h1>
        <p>Find your favorite movies</p>
    </header>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            placeholder="Enter movie name..."
        >

        <button id="searchBtn">Search</button>
    </div>

    <p id="message"></p>

    <main id="movieContainer" class="movie-container"></main>

    <div id="movieDetails" class="details"></div>

    <script src="script.js"></script>

</body>
</html>




<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101018;
    color: white;
    min-height: 100vh;
    padding: 25px;
}

header {
    text-align: center;
    margin-bottom: 30px;
}

header h1 {
    color: #f5c518;
    font-size: 35px;
    margin-bottom: 10px;
}

header p {
    color: #aaa;
}

.search-box {
    display: flex;
    max-width: 600px;
    margin: 0 auto 25px;
    gap: 10px;
}

input {
    flex: 1;
    padding: 14px;
    border: none;
    outline: none;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 14px 20px;
    border: none;
    border-radius: 8px;
    background: #f5c518;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #d9aa00;
}

#message {
    text-align: center;
    color: #f5c518;
    margin: 20px;
}

.movie-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: auto;
}

.movie-card {
    background: #1c1c28;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.3s;
}

.movie-card:hover {
    transform: translateY(-8px);
}

.movie-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
}

.movie-info {
    padding: 15px;
}

.movie-info h3 {
    margin-bottom: 10px;
    font-size: 18px;
}

.movie-info p {
    color: #bbb;
    margin-bottom: 12px;
}

.movie-info button {
    width: 100%;
    padding: 10px;
}

.details {
    max-width: 800px;
    margin: 30px auto;
}

.details-card {
    display: flex;
    gap: 25px;
    background: #1c1c28;
    padding: 20px;
    border-radius: 12px;
}

.details-card img {
    width: 220px;
    max-height: 330px;
    object-fit: cover;
    border-radius: 8px;
}

.details-card h2 {
    color: #f5c518;
    margin-bottom: 15px;
}

.details-card p {
    margin-bottom: 12px;
    line-height: 1.6;
    color: #ddd;
}

@media (max-width: 600px) {
    body {
        padding: 15px;
    }

    .search-box {
        flex-direction: column;
    }

    .details-card {
        flex-direction: column;
    }

    .details-card img {
        width: 100%;
        max-height: 400px;
    }
}
</style>



<script>
const API_KEY = "your_actual_api_key";

const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const movieContainer = document.getElementById("movieContainer");
const message = document.getElementById("message");
const movieDetails = document.getElementById("movieDetails");

searchBtn.addEventListener("click", searchMovies);

searchInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        searchMovies();
    }
});

async function searchMovies() {
    const movieName = searchInput.value.trim();

    if (movieName === "") {
        message.textContent = "Please enter a movie name!";
        movieContainer.innerHTML = "";
        movieDetails.innerHTML = "";
        return;
    }

    message.textContent = "Searching movies...";
    movieContainer.innerHTML = "";
    movieDetails.innerHTML = "";

    try {
        const url =
            `https://www.omdbapi.com/?s=${encodeURIComponent(movieName)}&apikey=${API_KEY}`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.Response === "False") {
            message.textContent = data.Error;
            return;
        }

        message.textContent = "";

        data.Search.forEach(function(movie) {
            createMovieCard(movie);
        });

    } catch (error) {
        message.textContent =
            "Something went wrong. Please check your internet connection.";
    }
}

function createMovieCard(movie) {
    const card = document.createElement("div");
    card.className = "movie-card";

    const poster = document.createElement("img");

    poster.src =
        movie.Poster !== "N/A"
            ? movie.Poster
            : "https://placehold.co/300x450?text=No+Poster";

    poster.alt = movie.Title;

    const info = document.createElement("div");
    info.className = "movie-info";

    const title = document.createElement("h3");
    title.textContent = movie.Title;

    const year = document.createElement("p");
    year.textContent = "Year: " + movie.Year;

    const detailsBtn = document.createElement("button");
    detailsBtn.textContent = "View Details";

    detailsBtn.addEventListener("click", function() {
        getMovieDetails(movie.imdbID);
    });

    info.appendChild(title);
    info.appendChild(year);
    info.appendChild(detailsBtn);

    card.appendChild(poster);
    card.appendChild(info);

    movieContainer.appendChild(card);
}

async function getMovieDetails(movieID) {
    movieDetails.textContent = "Loading movie details...";

    try {
        const url =
            `https://www.omdbapi.com/?i=${movieID}&plot=full&apikey=${API_KEY}`;

        const response = await fetch(url);
        const movie = await response.json();

        if (movie.Response === "False") {
            movieDetails.textContent = movie.Error;
            return;
        }

        showMovieDetails(movie);

    } catch (error) {
        movieDetails.textContent = "Unable to load movie details.";
    }
}

function showMovieDetails(movie) {
    movieDetails.innerHTML = "";

    const card = document.createElement("div");
    card.className = "details-card";

    const poster = document.createElement("img");

    poster.src =
        movie.Poster !== "N/A"
            ? movie.Poster
            : "https://placehold.co/300x450?text=No+Poster";

    poster.alt = movie.Title;

    const info = document.createElement("div");

    const title = document.createElement("h2");
    title.textContent = movie.Title;

    const year = document.createElement("p");
    year.textContent = "Year: " + movie.Year;

    const rating = document.createElement("p");
    rating.textContent = "IMDb Rating: " + movie.imdbRating;

    const genre = document.createElement("p");
    genre.textContent = "Genre: " + movie.Genre;

    const actors = document.createElement("p");
    actors.textContent = "Actors: " + movie.Actors;

    const plot = document.createElement("p");
    plot.textContent = "Plot: " + movie.Plot;

    info.appendChild(title);
    info.appendChild(year);
    info.appendChild(rating);
    info.appendChild(genre);
    info.appendChild(actors);
    info.appendChild(plot);

    card.appendChild(poster);
    card.appendChild(info);

    movieDetails.appendChild(card);

    movieDetails.scrollIntoView({
        behavior: "smooth"
    });
}
</script>
